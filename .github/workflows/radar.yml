name: Atualizar radar

on:
  schedule:
    # A cada hora, no minuto 17 (evita a fila do minuto 0 no GitHub Actions).
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "config/**"
      - "scripts/**"
      - "src/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/radar.yml"

permissions:
  contents: write
  # Token OIDC que identifica este repositório no Worker de tradução (Workers AI).
  id-token: write

concurrency:
  group: radar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Buscar manchetes e gerar index.html
        run: node scripts/build.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          # Opcional: com a chave, a tradução usa o Claude; sem ela, a IA da Cloudflare pelo Worker.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Opcional: outro modelo para a tradução (padrão: claude-opus-5).
          RADAR_TRANSLATION_MODEL: ${{ vars.RADAR_TRANSLATION_MODEL }}

      - name: Publicar no repositório
        run: |
          git add index.html privacidade.html editor.html data/translations.json data/images.json
          if git diff --cached --quiet -- index.html privacidade.html editor.html data/translations.json data/images.json; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Radar: manchetes de $(TZ=America/Sao_Paulo date +'%d/%m %H:%M')"
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 5))
          done
          exit 1
